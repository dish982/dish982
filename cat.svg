<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="A floating cat saying hi, welcome" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .float { animation: float 3.2s ease-in-out infinite; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 3.2s ease-in-out infinite; }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .rise { animation: rise 4s ease-in infinite; opacity: 0; }
    .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 2.4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes shadow { 0%,100% { transform: scale(1); opacity: .25; } 50% { transform: scale(.82); opacity: .15; } }
    @keyframes twinkle { 0%,100% { transform: scale(.5); opacity: .35; } 50% { transform: scale(1.15); opacity: 1; } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateY(-38px); opacity: 0; } }
    @keyframes wag { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(10deg); } }
  </style>

  <!-- ground shadow -->
  <ellipse class="shadow" cx="130" cy="222" rx="52" ry="7" fill="#b9a6d6"/>

  <!-- sparkles -->
  <g transform="translate(30,60)"><path class="tw" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z" fill="#f4a6c1"/></g>
  <g transform="translate(285,120)"><path class="tw" style="animation-delay:.7s" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z" fill="#b9a6d6"/></g>
  <g transform="translate(40,170)"><path class="tw" style="animation-delay:1.4s" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#9fd8c0"/></g>
  <g transform="translate(270,205)"><path class="tw" style="animation-delay:.3s" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#f2cf7a"/></g>
  <g transform="translate(200,100)"><path class="tw" style="animation-delay:1.1s" d="M0,-5 L1.5,-1.5 L5,0 L1.5,1.5 L0,5 L-1.5,1.5 L-5,0 L-1.5,-1.5 Z" fill="#f4a6c1"/></g>

  <!-- floating hearts -->
  <path class="rise" style="animation-delay:0s" transform="translate(70,60)" d="M0,3 C-6,-4 -12,2 0,10 C12,2 6,-4 0,3 Z" fill="#f4a6c1"/>
  <path class="rise" style="animation-delay:1.6s" transform="translate(225,170)" d="M0,3 C-6,-4 -12,2 0,10 C12,2 6,-4 0,3 Z" fill="#cdb4db"/>
  <path class="rise" style="animation-delay:2.8s" transform="translate(20,120)" d="M0,3 C-5,-3 -10,2 0,9 C10,2 5,-3 0,3 Z" fill="#f4c2d7"/>

  <!-- floating cat -->
  <g class="float">
    <g transform="translate(30,32)">
      <!-- tail -->
      <path class="tail" d="M146 168 C200 172 212 122 186 108" fill="none" stroke="#cdb4db" stroke-width="12" stroke-linecap="round"/>
      <!-- body -->
      <ellipse cx="100" cy="150" rx="48" ry="34" fill="#cdb4db"/>
      <ellipse cx="100" cy="158" rx="26" ry="20" fill="#e8dcf2"/>
      <!-- paws -->
      <ellipse cx="78" cy="178" rx="15" ry="8" fill="#bfa3d1"/>
      <ellipse cx="122" cy="178" rx="15" ry="8" fill="#bfa3d1"/>
      <!-- ears -->
      <polygon points="66,72 70,38 96,62" fill="#cdb4db"/>
      <polygon points="134,72 130,38 104,62" fill="#cdb4db"/>
      <polygon points="73,63 75,48 88,60" fill="#f4c2d7"/>
      <polygon points="127,63 125,48 112,60" fill="#f4c2d7"/>
      <!-- head -->
      <circle cx="100" cy="95" r="38" fill="#cdb4db"/>
      <!-- cheeks -->
      <ellipse cx="76" cy="108" rx="7" ry="4.5" fill="#f4c2d7" opacity="0.85"/>
      <ellipse cx="124" cy="108" rx="7" ry="4.5" fill="#f4c2d7" opacity="0.85"/>
      <!-- eyes -->
      <ellipse cx="86" cy="94" rx="4.5" ry="6" fill="#4a3f5c"/>
      <ellipse cx="114" cy="94" rx="4.5" ry="6" fill="#4a3f5c"/>
      <circle cx="87.5" cy="91.5" r="1.6" fill="#ffffff"/>
      <circle cx="115.5" cy="91.5" r="1.6" fill="#ffffff"/>
      <!-- nose and mouth -->
      <polygon points="96,104 104,104 100,109" fill="#e58fb0"/>
      <path d="M100 109 q-5 6 -10 3 M100 109 q5 6 10 3" fill="none" stroke="#4a3f5c" stroke-width="1.5" stroke-linecap="round"/>
      <!-- whiskers -->
      <path d="M70 104 L50 100 M70 109 L50 111 M130 104 L150 100 M130 109 L150 111" stroke="#4a3f5c" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <!-- speech bubble -->
      <rect x="150" y="14" width="104" height="40" rx="16" fill="#ffffff" stroke="#b9a6d6" stroke-width="2"/>
      <polygon points="158,52 172,52 146,72" fill="#ffffff" stroke="#b9a6d6" stroke-width="2" stroke-linejoin="round"/>
      <rect x="156" y="49" width="18" height="6" fill="#ffffff"/>
      <text x="202" y="39" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a3f5c">hi, welcome!</text>
    </g>
  </g>
</svg>
